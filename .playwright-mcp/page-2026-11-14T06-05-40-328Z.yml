                    - generic [ref=f1e155]: When should my first antenatal visit be?
                - region "06 When should my first antenatal visit be?":
                  - paragraph [ref=f1e159]: As soon as the pregnancy test is positive, ideally by 8 to 10 weeks, so tests and vitamins can start early.
              - generic [ref=f1e160]:
                - heading [level=3] [ref=f1e161]:
                  - button "07 How often are antenatal visits needed?" [ref=f1e162] [cursor=pointer]:
                    - generic [ref=f1e163]: "07"
                    - generic [ref=f1e164]: How often are antenatal visits needed?
                - region "07 How often are antenatal visits needed?":
                  - paragraph [ref=f1e168]: Monthly until week 28, every two weeks until week 36 and weekly after that, unless your doctor advises a different schedule.
              - generic [ref=f1e169]:
                - heading [level=3] [ref=f1e170]:
