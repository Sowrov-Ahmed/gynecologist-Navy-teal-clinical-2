                    - generic [ref=f1e173]: Is travel safe during pregnancy?
                - region "08 Is travel safe during pregnancy?":
                  - paragraph [ref=f1e177]: Travel is generally safe in the second trimester. Discuss long journeys with your doctor, especially after week 34 or with any complication.
              - generic [ref=f1e178]:
                - heading [level=3] [ref=f1e179]:
                  - button "09 Is laparoscopic surgery safe?" [ref=f1e180] [cursor=pointer]:
                    - generic [ref=f1e181]: "09"
                    - generic [ref=f1e182]: Is laparoscopic surgery safe?
                - region "09 Is laparoscopic surgery safe?":
                  - paragraph [ref=f1e186]: Yes. It is a well-established technique with smaller wounds, less pain and quicker recovery. Your suitability is checked before surgery.
              - generic [ref=f1e187]:
