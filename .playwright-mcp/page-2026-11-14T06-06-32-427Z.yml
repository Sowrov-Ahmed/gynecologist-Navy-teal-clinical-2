                    - generic [ref=f3e116]: Are walk-in patients seen?
                - region "04 Are walk-in patients seen?":
                  - paragraph [ref=f3e120]: Walk-ins are seen after booked patients, so waiting can be long. Booking ahead is strongly recommended.
              - generic [ref=f3e121]:
                - heading [level=3] [ref=f3e122]:
