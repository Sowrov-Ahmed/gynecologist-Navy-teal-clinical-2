                - region "03 Can I change or cancel my appointment?":
                  - paragraph [ref=f3e111]: Yes. Please inform us at least 12 hours ahead so the slot can be offered to another patient.
              - generic [ref=f3e112]:
                - heading [level=3] [ref=f3e113]:
                  - button "04 Are walk-in patients seen?" [ref=f3e114] [cursor=pointer]:
