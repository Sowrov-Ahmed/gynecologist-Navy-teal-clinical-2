                    - generic [ref=f3e125]: Is online consultation available?
                - region "05 Is online consultation available?":
                  - paragraph [ref=f3e129]: Existing patients can request video follow-ups. First visits are in person so that a proper examination can be done.
              - generic [ref=f3e130]:
                - heading [level=3] [ref=f3e131]:
                  - button "06 When should my first antenatal visit be?" [ref=f3e132] [cursor=pointer]:
                    - generic [ref=f3e133]: "06"
                    - generic [ref=f3e134]: When should my first antenatal visit be?
                - region "06 When should my first antenatal visit be?":
                  - paragraph [ref=f3e138]: As soon as the pregnancy test is positive, ideally by 8 to 10 weeks, so tests and vitamins can start early.
              - generic [ref=f3e139]:
                - heading [level=3] [ref=f3e140]:
                  - button "07 How often are antenatal visits needed?" [ref=f3e141] [cursor=pointer]:
                    - generic [ref=f3e142]: "07"
                    - generic [ref=f3e143]: How often are antenatal visits needed?
                - region "07 How often are antenatal visits needed?":
                  - paragraph [ref=f3e147]: Monthly until week 28, every two weeks until week 36 and weekly after that, unless your doctor advises a different schedule.
              - generic [ref=f3e148]:
                - heading [level=3] [ref=f3e149]:
                  - button "08 Is travel safe during pregnancy?" [ref=f3e150] [cursor=pointer]:
                    - generic [ref=f3e151]: "08"
                    - generic [ref=f3e152]: Is travel safe during pregnancy?
                - region "08 Is travel safe during pregnancy?":
                  - paragraph [ref=f3e156]: Travel is generally safe in the second trimester. Discuss long journeys with your doctor, especially after week 34 or with any complication.
              - generic [ref=f3e157]:
                - heading [level=3] [ref=f3e158]:
                  - button "09 Is laparoscopic surgery safe?" [ref=f3e159] [cursor=pointer]:
                    - generic [ref=f3e160]: "09"
                    - generic [ref=f3e161]: Is laparoscopic surgery safe?
                - region "09 Is laparoscopic surgery safe?":
                  - paragraph [ref=f3e165]: Yes. It is a well-established technique with smaller wounds, less pain and quicker recovery. Your suitability is checked before surgery.
              - generic [ref=f3e166]:
                - heading [level=3] [ref=f3e167]:
                  - button "10 Does every PCOS patient need medicines?" [ref=f3e168] [cursor=pointer]:
                    - generic [ref=f3e169]: "10"
                    - generic [ref=f3e170]: Does every PCOS patient need medicines?
                - region "10 Does every PCOS patient need medicines?":
                  - paragraph [ref=f3e174]: No. Many women improve with diet and exercise alone. Medicines are added only when tests and symptoms require them.
              - generic [ref=f3e175]:
                - heading [level=3] [ref=f3e176]:
