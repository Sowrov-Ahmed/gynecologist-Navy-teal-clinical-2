<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-24 overflow-x-clip">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Dr. Rukhsana Alam</title>
<meta name="description" content="Call, WhatsApp, email or send a message to Dr. Rukhsana Alam's team, and find the nearest chamber on the map.">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="assets/js/tailwind-config.js"></script>
</head>
<body class="relative overflow-x-clip bg-white font-body text-body antialiased" data-page="contact" data-no-cta>
<div id="site-header"></div>
<main id="main">
  <div id="page-head"></div>
  <section class="bg-white py-16 sm:py-20 lg:py-24" aria-labelledby="reach-title">
    <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
      <div id="reach-head"></div>
      <div class="mt-10 grid gap-10 lg:grid-cols-12 lg:gap-14">
        <div id="contact-info" class="lg:col-span-5"></div>
        <div class="lg:col-span-7" data-reveal="right">
          <div class="rounded-md border border-ice-2 border-t-4 border-t-teal bg-white p-6 shadow-card sm:p-8">
            <form id="contact-form" novalidate aria-labelledby="form-title">
              <h2 id="form-title" class="font-heading text-2xl font-extrabold text-navy">Send us a message</h2>
              <span class="mt-3 block h-1 w-16 bg-teal"></span>
              <div class="mt-6 grid gap-5 sm:grid-cols-2">
                <div>
                  <label for="cf-name" class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-navy">Full name</label>
                  <input id="cf-name" name="name" type="text" autocomplete="name" required class="w-full rounded border border-slate-300 bg-white px-4 py-3 text-sm text-navy placeholder:text-slate-400 transition focus:border-teal focus:outline-none focus:ring-4 focus:ring-teal/25" placeholder="Your full name">
                </div>
                <div>
                  <label for="cf-phone" class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-navy">Mobile number</label>
                  <input id="cf-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required class="w-full rounded border border-slate-300 bg-white px-4 py-3 text-sm text-navy placeholder:text-slate-400 transition focus:border-teal focus:outline-none focus:ring-4 focus:ring-teal/25" placeholder="01XXX-XXXXXX">
                </div>
                <div>
                  <label for="cf-email" class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-navy">Email</label>
                  <input id="cf-email" name="email" type="email" autocomplete="email" required class="w-full rounded border border-slate-300 bg-white px-4 py-3 text-sm text-navy placeholder:text-slate-400 transition focus:border-teal focus:outline-none focus:ring-4 focus:ring-teal/25" placeholder="you@example.com">
                </div>
                <div>
                  <label for="cf-subject" class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-navy">Subject</label>
                  <select id="cf-subject" name="subject" required class="w-full rounded border border-slate-300 bg-white px-4 py-3 text-sm text-navy transition focus:border-teal focus:outline-none focus:ring-4 focus:ring-teal/25">
                    <option value="">Choose a subject</option>
                    <option>Appointment help</option>
                    <option>Report query</option>
                    <option>Feedback</option>
                    <option>Other</option>
                  </select>
                </div>
              </div>
              <div class="mt-5">
                <div class="flex items-end justify-between gap-3">
                  <label for="cf-message" class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-navy">Message</label>
                  <span id="cf-count" class="mb-1.5 text-xs font-semibold text-slate-500" aria-live="polite">0 / 500</span>
                </div>
                <textarea id="cf-message" name="message" rows="5" maxlength="500" required class="w-full rounded border border-slate-300 bg-white px-4 py-3 text-sm text-navy placeholder:text-slate-400 transition focus:border-teal focus:outline-none focus:ring-4 focus:ring-teal/25" placeholder="How can we help you?"></textarea>
              </div>
              <p class="mt-4 text-xs text-slate-500">Please do not share detailed medical records here. Our team replies within one working day.</p>
              <button type="submit" class="mt-6 inline-flex min-h-12 w-full items-center justify-center gap-2 rounded bg-teal px-6 py-3.5 text-sm font-bold uppercase tracking-wide text-navy transition duration-300 hover:bg-navy hover:text-white focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-teal/40 sm:w-auto">Send message</button>
            </form>
            <div id="cf-success" class="hidden" role="status" tabindex="-1"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="bg-ice py-16 sm:py-20 lg:py-24" aria-labelledby="map-title">
    <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
      <div id="map-head"></div>
      <div id="map-body" class="mt-10"></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/contact.js"></script>
</body>
</html>
